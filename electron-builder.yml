appId: com.lhd.aivoicenote
productName: AI语音对话笔记
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: zip
      arch: [x64]
    - target: dir
      arch: [x64]
  # 绿色免安装版不需要 NSIS 安装程序
electronLanguages:
  - zh-CN
  - en-US
npmRebuild: false
