appId: com.lhd.aivoicenote
productName: AI语音对话笔记
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# 使用本地已安装的 Electron 二进制，避免 electron-builder 联网下载 GitHub 资源超时
electronDist: node_modules/electron/dist
win:
  target:
    - target: zip
      arch: [x64]
    - target: dir
      arch: [x64]
  # 绿色免安装版不需要 NSIS 安装程序
electronLanguages:
  - zh-CN
  - en-US
npmRebuild: false
